{% extends "base.html" %}
{% block content %}

<section class="section">
    <div class="container" style="max-width: 600px;">

        <!-- PAGE HEADER -->
        <div style="text-align: center; margin-bottom: 32px;">
            <h1 class="section-title" style="margin: 0 0 8px 0;">Add New Product</h1>
            <p style="color: var(--text-light);">Fill in the product details below</p>
        </div>

        <!-- ERROR MESSAGE -->
        {% if error %}
        <div
            style="background: #fee2e2; color: #991b1b; padding: 14px; border-radius: 6px; margin-bottom: 24px; border-left: 4px solid #dc2626;">
            <p style="margin: 0; font-weight: 600;">❌ Error</p>
            <p style="margin: 4px 0 0 0; font-size: 13px;">{{ error }}</p>
        </div>
        {% endif %}

        <!-- ADD PRODUCT FORM -->
        <form method="POST" enctype="multipart/form-data" class="product-form">

            <div class="form-group">
                <label for="name">Product Name *</label>
                <input type="text" id="name" name="name" placeholder="e.g., HD Security Camera" required>
            </div>

            <div class="form-group">
                <label for="description">Product Description *</label>
                <textarea id="description" name="description" placeholder="Enter product description..." rows="5"
                    required></textarea>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 18px;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="price">Price (₹) *</label>
                    <input type="number" id="price" name="price" placeholder="0.00" step="0.01" required>
                </div>

                <div class="form-group" style="margin-bottom: 0;">
                    <label for="category_id">Category ID *</label>
                    <input type="number" id="category_id" name="category_id" placeholder="1" required>
                </div>
            </div>

            <div class="form-group">
                <label for="image">Product Image *</label>
                <div style="position: relative; border: 2px dashed var(--border); border-radius: var(--radius-md); padding: 24px; text-align: center; transition: var(--transition);"
                    id="drop-zone">
                    <input type="file" id="image" name="image" accept="image/*" required style="display: none;">
                    <div>
                        <p style="font-size: 32px; margin-bottom: 8px;">📷</p>
                        <p style="margin: 0; font-weight: 600; color: var(--text);">Click to upload or drag & drop</p>
                        <p style="margin: 4px 0 0 0; font-size: 12px; color: var(--text-light);">PNG, JPG, GIF up to 5MB
                        </p>
                    </div>
                    <span id="file-name"
                        style="display: none; margin-top: 12px; font-size: 13px; color: var(--success); font-weight: 600;"></span>
                </div>
            </div>

            <!-- FORM ACTIONS -->
            <div style="display: flex; gap: 12px; margin-top: 28px;">
                <button type="submit" class="btn" style="flex: 1; padding: 13px; font-size: 15px;">
                    ✅ Add Product
                </button>
                <a href="/admin" class="btn"
                    style="flex: 1; padding: 13px; text-align: center; font-size: 15px; background: var(--text-light);">
                    ← Back
                </a>
            </div>
        </form>

    </div>
</section>

<style>
    .product-form {
        background: var(--white);
        padding: 28px;
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-sm);
        border: 1px solid var(--border);
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 6px;
        color: var(--text);
    }

    .form-group input,
    .form-group textarea {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        font-size: 14px;
        font-family: inherit;
        transition: var(--transition);
    }

    .form-group input:focus,
    .form-group textarea:focus {
        outline: none;
        border-color: var(--secondary);
        box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.1);
    }

    #drop-zone {
        cursor: pointer;
    }

    #drop-zone:hover {
        background: rgba(29, 78, 216, 0.02);
        border-color: var(--secondary);
    }

    #drop-zone.dragover {
        background: rgba(29, 78, 216, 0.08);
        border-color: var(--secondary);
    }
</style>

<script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('image');
    const fileName = document.getElementById('file-name');

    // Click to upload
    dropZone.addEventListener('click', () => fileInput.click());

    // Drag and drop
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        fileInput.files = e.dataTransfer.files;
        updateFileName();
    });

    fileInput.addEventListener('change', updateFileName);

    function updateFileName() {
        if (fileInput.files && fileInput.files[0]) {
            fileName.textContent = '✓ ' + fileInput.files[0].name;
            fileName.style.display = 'block';
        }
    }
</script>

{% endblock %}
